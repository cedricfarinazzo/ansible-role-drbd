---
# Restart only on a change, a new certificate restarts tlshd, a peer from another CA is refused, drbd_tls false
# removes the role's files, then absent purges ktls-utils.
- name: Side effect
  hosts: all
  tasks:
    - name: Read the tlshd process
      ansible.builtin.systemd_service:
        name: tlshd.service
      register: molecule_pid_before

    - name: Run the role unchanged
      ansible.builtin.include_role:
        name: ../../../../ansible-role-drbd

    - name: Read the tlshd process again
      ansible.builtin.systemd_service:
        name: tlshd.service
      register: molecule_pid_same

    - name: No restart without a change
      ansible.builtin.assert:
        that:
          - molecule_pid_same.status.MainPID == molecule_pid_before.status.MainPID

    - name: Re-issue the first peer's certificate (same key, new serial)
      ansible.builtin.shell: |
        set -euo pipefail
        /root/make-pki.sh /root/pki {{ inventory_hostname }} > /dev/null
        cp /root/pki/{{ inventory_hostname }}.pem /etc/ssl/example/cert.pem
      args:
        executable: /bin/bash
      changed_when: true
      when: inventory_hostname == ansible_play_hosts | first

    - name: Run the role on the new certificate
      ansible.builtin.include_role:
        name: ../../../../ansible-role-drbd

    - name: Read the tlshd process after the new certificate
      ansible.builtin.systemd_service:
        name: tlshd.service
      register: molecule_pid_after

    - name: A new certificate restarted tlshd, on its peer only
      ansible.builtin.assert:
        that: >-
          molecule_pid_after.status.MainPID != molecule_pid_before.status.MainPID if inventory_hostname == ansible_play_hosts | first
          else molecule_pid_after.status.MainPID == molecule_pid_before.status.MainPID

    - name: The new certificate still makes the handshake
      ansible.builtin.include_tasks: ../files/handshake.yml

    - name: A client certificate from another CA is refused
      ansible.builtin.include_tasks: ../files/handshake.yml
      vars:
        molecule_client_cert: /root/other-ca-cert.pem
        molecule_expect: refused

    - name: Kernel TLS off
      ansible.builtin.include_role:
        name: ../../../../ansible-role-drbd
      vars:
        drbd_tls: false

    - name: The role's tlshd files are gone, ktls-utils stays
      ansible.builtin.shell: |
        set -o pipefail
        fail() { echo "FAIL: $*"; exit 1; }
        for f in /etc/tlshd-drbd.conf /etc/systemd/system/tlshd.service.d /etc/modules-load.d/drbd-tls.conf; do
          if [ -e $f ]; then fail "$f left"; fi
        done
        dpkg-query -W -f='${db:Status-Status}' ktls-utils | grep -qx installed || fail "ktls-utils removed"
        if systemctl show -p ExecStart tlshd.service | grep -q tlshd-drbd; then fail "unit still on the role's config"; fi
      args:
        executable: /bin/bash
      changed_when: false

    # Two tasks, no loop: the role's own loops set item
    - name: Kernel TLS on again
      ansible.builtin.include_role:
        name: ../../../../ansible-role-drbd

    - name: Run absent
      ansible.builtin.include_role:
        name: ../../../../ansible-role-drbd
      vars:
        drbd_state: absent

    - name: Absent purged ktls-utils and the role's files
      ansible.builtin.shell: |
        set -o pipefail
        fail() { echo "FAIL: $*"; exit 1; }
        if dpkg-query -W -f='${db:Status-Status}' ktls-utils 2> /dev/null | grep -qx installed; then fail "ktls-utils left"; fi
        for f in /etc/tlshd-drbd.conf /etc/systemd/system/tlshd.service.d /etc/modules-load.d/drbd-tls.conf; do
          if [ -e $f ]; then fail "$f left"; fi
        done
      args:
        executable: /bin/bash
      changed_when: false
