---
# Imported first by every prepare. The image's policy-rc.d (exit 101) stops every postinst from starting its
# service; a real host starts it at once: removed, so the scenarios install as a host does
- name: Packages start their services on install, as on a host
  ansible.builtin.file:
    path: /usr/sbin/policy-rc.d
    state: absent

# Each tlshd start records whether the role's configuration and drop-in were in place ("role") or not
# ("package"); in /run, out of the role's and the absent checks' way
- name: Drop-in directory of tlshd
  ansible.builtin.file:
    path: /run/systemd/system/tlshd.service.d
    state: directory
    mode: "0755"

- name: Record the configuration each tlshd start finds
  ansible.builtin.copy:
    dest: /run/systemd/system/tlshd.service.d/molecule-start.conf
    content: |
      [Service]
      ExecStartPre=+/bin/sh -c 'if grep -qs cedricfarinazzo.drbd /etc/tlshd-drbd.conf \
        && grep -qs cedricfarinazzo.drbd /etc/systemd/system/tlshd.service.d/50-drbd-role.conf; \
        then echo role; else echo package; fi >> /run/molecule-tlshd-starts'
    mode: "0644"

- name: Systemd reads the drop-in
  ansible.builtin.systemd_service:
    daemon_reload: true
