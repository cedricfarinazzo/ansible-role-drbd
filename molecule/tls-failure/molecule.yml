---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: tls-failure-${MOLECULE_DISTRO:-debian13}
    hostname: tls-failure-${MOLECULE_DISTRO:-debian13}
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare/playbook.yml
    converge: converge/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
        drbd_kernel_headers_package: linux-headers-amd64
        drbd_module_load: false
        drbd_dkms_spaas: false
        drbd_dkms_local_spatch: true
        drbd_tls: true
        drbd_tls_certificate: /etc/ssl/example/cert.pem
        drbd_tls_private_key: /etc/ssl/example/key.pem
        drbd_tls_truststore: /etc/ssl/example/ca.pem
        drbd_tls_kernel_config: /root/kernel-config
verifier:
  name: ansible
scenario:
  name: tls-failure
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
