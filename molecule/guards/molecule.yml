---
# The reboot guard and the APT pin check, on real APT and dpkg state: a reboot flag, an archive kernel and an
# installed one that are not the running kernel, pins an installed version does or does not match.
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: guards-${MOLECULE_DISTRO:-debian13}
    hostname: guards-${MOLECULE_DISTRO:-debian13}
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare/playbook.yml
    converge: converge/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
        drbd_kernel_headers_package: ""
        drbd_module_load: false
        # The container runs the CI host's kernel: the cases name the distribution's flavor
        molecule_flavor: "{{ 'generic' if ansible_facts.distribution == 'Ubuntu' else 'amd64' }}"
verifier:
  name: ansible
scenario:
  name: guards
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
