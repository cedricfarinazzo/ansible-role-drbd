---
# Each check line ends in "|| fail": a shell task's status is its last command's only.
- name: Verify the 9.34 unit
  hosts: all
  gather_facts: false
  tasks:
    - name: The drbd-utils 9.34 package ships drbd-graceful-shutdown only
      ansible.builtin.shell: |
        set -o pipefail
        fail() { echo "FAIL: $*"; exit 1; }
        v=$(dpkg-query -W -f '${Version}' drbd-utils); [[ $v == 9.34.* ]] || fail "drbd-utils $v"
        [ -e /usr/lib/systemd/system/drbd-graceful-shutdown.service ] || fail "no drbd-graceful-shutdown.service"
        for u in drbd-graceful-down drbd-graceful-disconnect; do
          [ ! -e /usr/lib/systemd/system/$u.service ] || fail "$u shipped by 9.34"
        done
      args:
        executable: /bin/bash
      changed_when: false

    - name: The unit is wanted from boot, active, ordered after the guests, its own ordering kept
      ansible.builtin.shell: |
        set -o pipefail
        fail() { echo "FAIL: $*"; exit 1; }
        u=drbd-graceful-shutdown.service
        w=/etc/systemd/system/multi-user.target.wants/$u
        [ -L $w ] && [ -e $w ] || fail "wants link missing or dangling"
        [ "$(readlink -f $w)" = "$(readlink -f /usr/lib/systemd/system/$u)" ] || fail "wants link target: $(readlink $w)"
        systemctl show -p WantedBy --value $u | grep -qw multi-user.target || fail "not wanted"
        systemctl is-active -q $u || fail "not active"
        b=$(systemctl show -p Before --value $u)
        [[ " $b " == *" example-guests.service "* ]] || fail "Before misses example-guests.service: $b"
        [[ " $b " == *" drbd.service "* ]] || fail "the unit's own Before= lost: $b"
        [ "$(cat /etc/systemd/system/$u.d/50-drbd-role.conf)" = "$(printf '[Unit]\nBefore=example-guests.service')" ] \
          || fail "drop-in: $(cat /etc/systemd/system/$u.d/50-drbd-role.conf)"
        [ "$(stat -c %a /etc/systemd/system/$u.d/50-drbd-role.conf)" = 644 ] || fail "drop-in mode"
      args:
        executable: /bin/bash
      changed_when: false

    - name: Nothing for the 9.35 units, no mask
      ansible.builtin.shell: |
        fail() { echo "FAIL: $*"; exit 1; }
        for u in drbd-graceful-down drbd-graceful-disconnect; do
          [ ! -e /etc/systemd/system/multi-user.target.wants/$u.service ] || fail "$u wanted"
          [ ! -e /etc/systemd/system/$u.service.d ] || fail "$u drop-in directory"
        done
        [ ! -L /etc/systemd/system/drbd-graceful-shutdown.service ] || fail "masked"
      args:
        executable: /bin/bash
      changed_when: false
