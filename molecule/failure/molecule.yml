---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: drbd-failure-${MOLECULE_DISTRO:-debian13}
    hostname: drbd-failure
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare/playbook.yml
    converge: converge/playbook.yml
    verify: verify/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
        drbd_module_load: false
        molecule_headers: "{{ 'linux-headers-amd64' if ansible_facts['distribution'] == 'Debian' else 'linux-headers-generic' }}"
verifier:
  name: ansible
scenario:
  name: failure
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
