---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  # Name carries the distribution, so several distributions run side by side
  - name: drbd-${MOLECULE_DISTRO:-debian13}
    hostname: drbd
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  playbooks:
    prepare: prepare/playbook.yml
    converge: converge/playbook.yml
    verify: verify/playbook.yml
    side_effect: side_effect/playbook.yml
  inventory:
    group_vars:
      all:
        ansible_become: false
        # The container runs the CI host's kernel: build for the distribution's headers instead, never load
        drbd_kernel_headers_package: "{{ molecule_headers }}"
        drbd_module_load: false
        drbd_module_options:
          minor_count: 64
          disable_sendpage: true
        molecule_headers: "{{ 'linux-headers-amd64' if ansible_facts['distribution'] == 'Debian' else 'linux-headers-generic' }}"
verifier:
  name: ansible
scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - verify
    - idempotence
    - side_effect
    - destroy
