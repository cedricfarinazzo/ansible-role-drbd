---
# present: DRBD 9 packages, DKMS build and module; absent: remove what the role added
drbd_state: present

# linbit: add LINBIT's APT source and key (below); distribution: install from the sources already configured
drbd_install_method: linbit

# LINBIT source; empty = the default for this distribution (vars/main.yml). drbd_apt_key_fingerprint is
# checked against the downloaded key before anything trusts it
drbd_apt_repo_url: ""
drbd_apt_suite: ""
drbd_apt_components: []
drbd_apt_key_url: ""
drbd_apt_key_fingerprint: ""
# The key file inside the downloaded .deb (the package itself is never installed); empty = the download is the key
drbd_apt_key_deb_member: ""
# Keyring named by Signed-By on the LINBIT source only
drbd_apt_keyring: /etc/apt/keyrings/linbit.gpg

drbd_packages:
  - drbd-dkms
  - drbd-utils
drbd_packages_extra: []
# APT pins, package -> version glob (e.g. {drbd-utils: "9.35.*"}), in /etc/apt/preferences.d/drbd.pref; {} = none
drbd_apt_pins: {}

# Headers metapackage DKMS builds against: auto = the one of the running kernel's flavor
# (linux-headers-amd64, linux-headers-generic...); "" = install none
drbd_kernel_headers_package: auto

# Kernels DKMS builds for: auto = the running kernel and the newest kernel, each when its headers are present
drbd_dkms_kernels: auto
# false builds without LINBIT's spatch-as-a-service (the build otherwise sends the kernel's compat.h to
# spaas.drbd.io and applies the patch it returns); it then needs a cached patch or a local spatch (below)
drbd_dkms_spaas: true
# Install coccinelle (spatch), so a kernel with no cached compat patch builds offline
drbd_dkms_local_spatch: false

# Load the module now (an older loaded drbd, not in use, is unloaded first), and at each boot
drbd_module_load: true
drbd_module_load_at_boot: true
# Module parameters, e.g. {minor_count: 64}; written to /etc/modprobe.d/drbd.conf (booleans as 1/0)
drbd_module_options: {}
# modprobe drbd loads only a DKMS build (updates/): a kernel DKMS missed refuses its in-tree DRBD 8.4
drbd_module_dkms_only: true

# usage-count in global_common.conf: false = "no" (drbd-utils ships "yes", which reports to LINBIT)
drbd_usage_count: false

# true masks the graceful units, e.g. when a cluster manager stops DRBD itself; false removes masks to
# /dev/null; null leaves them alone
drbd_mask_graceful_shutdown: null
# true wants the graceful units from boot (drbd-utils' udev rule otherwise starts them only with the first
# DRBD device), so DRBD goes down cleanly at shutdown; false removes the wants links and the role's drop-in;
# null leaves them alone. Not true with drbd_mask_graceful_shutdown true
drbd_graceful_shutdown: null
drbd_graceful_shutdown_wanted_by: multi-user.target
# Units every graceful unit (down and disconnect) waits for at shutdown, e.g. the service that stops the VMs on DRBD devices
drbd_graceful_shutdown_before: []

# Lines of the DKMS make.log printed when a build fails
drbd_dkms_log_lines: 40

# Kernel TLS for DRBD replication (DRBD 9.2.6+, drbd-utils 9.26+): installs ktls-utils, runs tlshd with the
# certificate, key and CA below, loads the tls module. The role never sets DRBD's net option tls: the
# resource config (net { tls yes; }) or LINSTOR (DrbdOptions/Net/tls yes) does
drbd_tls: false
# From the configured sources; pin a version with drbd_apt_pins (e.g. {ktls-utils: "1.5.*"})
drbd_tls_packages:
  - ktls-utils
# PEM files on the host, presented and trusted by tlshd for both ends of each handshake. The key is owned by
# root, mode 0600 or 0640; the certificate must chain to the CA file and match the key
drbd_tls_certificate: ""
drbd_tls_private_key: ""
drbd_tls_truststore: ""
# The certificate must stay valid this many days, or the role stops
drbd_tls_cert_min_days: 0
# tlshd's config, written by the role and loaded with tlshd -c (a drop-in), so the package's own file stays
drbd_tls_config_file: /etc/tlshd-drbd.conf
# tlshd [debug] loglevel (0 = quiet)
drbd_tls_loglevel: 0
# Stop before any change when the kernel config lacks an option below; auto = /boot/config-<running kernel>,
# then /proc/config.gz
drbd_tls_kernel_check: true
drbd_tls_kernel_config: auto
drbd_tls_kernel_options:
  - CONFIG_TLS
  - CONFIG_NET_HANDSHAKE
