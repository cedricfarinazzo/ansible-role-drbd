---
- name: Validate inputs
  ansible.builtin.import_tasks: validate.yml

- name: DRBD 9
  when: drbd_state == 'present'
  block:
    - name: No reboot pending
      ansible.builtin.include_tasks: kernel_guard.yml
      when: drbd_kernel_guard

    - name: Kernel TLS support
      ansible.builtin.include_tasks: tls_kernel.yml
      when: drbd_tls and drbd_tls_kernel_check

    - name: No foreign tlshd ordering drop-in
      ansible.builtin.include_tasks: tls_after_check.yml
      when: drbd_tls and drbd_tls_after_units | length > 0

    - name: LINBIT source and key
      ansible.builtin.include_tasks: repo.yml
      when: drbd_install_method == 'linbit'

    - name: Packages
      ansible.builtin.include_tasks: install.yml

    - name: DKMS build
      ansible.builtin.include_tasks: dkms.yml

    - name: Module and settings
      ansible.builtin.include_tasks: module.yml

    - name: Kernel TLS
      ansible.builtin.include_tasks: tls.yml
      when: drbd_tls

    - name: No kernel TLS by the role
      ansible.builtin.include_tasks: tls_off.yml
      when: not drbd_tls

    - name: Installed versions of the pinned packages
      ansible.builtin.include_tasks: pins_check.yml
      when: drbd_apt_pins_check and drbd_apt_pins | length > 0

- name: Remove DRBD
  ansible.builtin.include_tasks: absent.yml
  when: drbd_state == 'absent'
