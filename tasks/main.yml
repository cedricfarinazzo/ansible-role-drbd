---
- name: Validate inputs
  ansible.builtin.import_tasks: validate.yml

- name: DRBD 9
  when: drbd_state == 'present'
  block:
    - name: LINBIT source and key
      ansible.builtin.include_tasks: repo.yml
      when: drbd_install_method == 'linbit'

    - name: Packages
      ansible.builtin.include_tasks: install.yml

    - name: DKMS build
      ansible.builtin.include_tasks: dkms.yml

    - name: Module and settings
      ansible.builtin.include_tasks: module.yml

- name: Remove DRBD
  ansible.builtin.include_tasks: absent.yml
  when: drbd_state == 'absent'
