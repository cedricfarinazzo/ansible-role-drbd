---
# APT ignores a pin no available version matches and installs the best other version, silently: read what landed.
- name: Read the installed versions of the pinned packages
  ansible.builtin.command: dpkg-query -W -f=${db:Status-Status}\ ${Version} {{ item | quote }}
  loop: "{{ drbd_apt_pins.keys() | list }}"
  register: drbd_pins_installed
  changed_when: false
  failed_when: false
  check_mode: false

# Check mode on a fresh host: a package not installed yet is no failure
- name: Every pinned package is installed at a version its pin matches
  ansible.builtin.assert:
    that:
      - item.stdout is regex(drbd_pin_re) or (ansible_check_mode and not item.stdout.startswith('installed '))
    fail_msg: >-
      {{ item.item }} {{ item.stdout.split(' ', 1) | last if item.stdout.startswith('installed ') else 'not installed' }}
      is not {{ drbd_apt_pins[item.item] }}: the pin in {{ drbd_apt_pin_file }} matched no available version
    quiet: true
  loop: "{{ drbd_pins_installed.results }}"
  loop_control:
    label: "{{ item.item }}"
  vars:
    # The glob as a regex with no backslash (a Jinja literal unescapes them again): pieces escaped, joined by .*
    drbd_pin_re: "^installed {{ (drbd_apt_pins[item.item] | string).split('*') | map('regex_escape') | join('.*') }}$"
