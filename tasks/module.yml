---
# Written with the role's marker; a file without it is an admin's and is never removed
- name: Find the modprobe.d file
  ansible.builtin.slurp:
    src: "{{ drbd_modprobe_file }}"
  register: drbd_modprobe_read
  failed_when: false

- name: Module parameters and the DKMS-only load rule
  ansible.builtin.copy:
    dest: "{{ drbd_modprobe_file }}"
    content: |
      {{ drbd_marker }}
      {% if drbd_module_options | length > 0 %}
      {{ drbd_module_options_line }}
      {% endif %}
      {% if drbd_module_dkms_only %}
      # A kernel DKMS did not build for would load its in-tree DRBD 8.4: refuse it
      install drbd /bin/sh -c 'case "$(/sbin/modinfo -n drbd 2>/dev/null)" in */updates/*) exec /sbin/modprobe --ignore-install drbd $CMDLINE_OPTS;; esac; echo "drbd: no DKMS build of DRBD 9 for $(uname -r), refusing the in-tree module" >&2; exit 1'
      {% endif %}
    owner: root
    group: root
    mode: "0644"
  register: drbd_modprobe_written
  when: drbd_module_options | length > 0 or drbd_module_dkms_only

- name: No module parameters nor load rule
  ansible.builtin.file:
    path: "{{ drbd_modprobe_file }}"
    state: absent
  when:
    - drbd_module_options | length == 0 and not drbd_module_dkms_only
    - (drbd_modprobe_read.content | default('') | b64decode).startswith(drbd_marker)

- name: Module loaded at boot
  ansible.builtin.copy:
    dest: "{{ drbd_modules_load_file }}"
    content: "drbd\n"
    owner: root
    group: root
    mode: "0644"
  when: drbd_module_load_at_boot

- name: Module not loaded at boot by the role
  ansible.builtin.file:
    path: "{{ drbd_modules_load_file }}"
    state: absent
  when: not drbd_module_load_at_boot

- name: Load DRBD 9
  when: drbd_module_load
  block:
    - name: Read the loaded DRBD version
      ansible.builtin.command: cat /sys/module/drbd/version
      register: drbd_loaded
      changed_when: false
      check_mode: false
      failed_when: false

    # The distribution kernel's in-tree drbd (8.4) loads first when nothing pinned DRBD 9 yet
    - name: Unload an older DRBD
      ansible.builtin.command: modprobe -r drbd
      when: drbd_loaded.rc == 0 and drbd_loaded.stdout is not match('^9[.]')
      register: drbd_unload
      changed_when: true

    - name: Load the module
      community.general.modprobe:
        name: drbd
        state: present
      when: drbd_loaded.rc != 0 or drbd_loaded.stdout is not match('^9[.]')

    - name: Read the DRBD version now loaded
      ansible.builtin.command: cat /sys/module/drbd/version
      register: drbd_loaded_now
      changed_when: false
      check_mode: false
      failed_when: false

    - name: DRBD 9 is loaded
      ansible.builtin.assert:
        that:
          - ansible_check_mode or drbd_loaded_now.stdout is match('^9[.]')
        fail_msg: >-
          drbd {{ drbd_loaded_now.stdout or 'none' }} loaded, not 9.x: kernel {{ ansible_facts.kernel }} may have
          no DKMS build (its headers missing: reboot into a kernel listed by dkms status drbd), or modprobe
          finds the in-tree module first
        quiet: true

    # A loaded 9.x is never reloaded by the role: a new build or new options wait for a reload or a reboot
    - name: Report a loaded DRBD that differs from the build or its options
      ansible.builtin.debug:
        msg: >-
          {{ 'Loaded drbd ' ~ drbd_loaded_now.stdout ~ ' is not the DKMS build ' ~ drbd_dkms_version ~ '. '
          if drbd_loaded_stale else '' }}{{ 'Module options changed. ' if drbd_options_stale else '' }}Reload
          drbd (resources down, then modprobe -r drbd; modprobe drbd) or reboot to apply.
      when: not ansible_check_mode and (drbd_loaded_stale or drbd_options_stale)
      vars:
        drbd_loaded_stale: >-
          {{ drbd_loaded_now.stdout is match('^9[.]') and drbd_dkms_version | length > 0
          and not drbd_dkms_version.startswith(drbd_loaded_now.stdout) }}
        drbd_options_stale: "{{ drbd_modprobe_written is changed and drbd_loaded.rc == 0 }}"
  rescue:
    - name: Stop on the module failure
      ansible.builtin.fail:
        msg: >-
          {{ 'drbd ' ~ drbd_loaded.stdout ~ ' is loaded and in use: stop its resources (drbdsetup down all), then
          run again' if drbd_unload is failed else ansible_failed_result.msg | default('modprobe drbd failed') }}

- name: Find the DRBD global config
  ansible.builtin.stat:
    path: "{{ drbd_global_conf }}"
  register: drbd_global_conf_stat

- name: Usage reporting to LINBIT
  ansible.builtin.replace:
    path: "{{ drbd_global_conf }}"
    regexp: '^(\s*)usage-count\s+\w+;'
    replace: '\1usage-count {{ "yes" if drbd_usage_count else "no" }};'
  when: drbd_global_conf_stat.stat.exists

- name: Graceful shutdown units
  ansible.builtin.include_tasks: graceful.yml
