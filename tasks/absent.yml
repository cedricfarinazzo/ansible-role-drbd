---
# Never with live resources: the purge runs drbd-utils' prerm, which can take every resource down
- name: Find live DRBD resources
  ansible.builtin.shell: |
    set -o pipefail
    ls -d /sys/block/drbd* 2>/dev/null || true
    # drbdsetup fails without the module loaded: no resource then
    if command -v drbdsetup > /dev/null; then { drbdsetup status 2>/dev/null || true; } | sed -n 's/^\([^ ]\+\) role:.*/\1/p'; fi
  args:
    executable: /bin/bash
  register: drbd_live
  changed_when: false
  check_mode: false

- name: No DRBD resource is up
  ansible.builtin.assert:
    that:
      - drbd_live.stdout_lines | length == 0
    fail_msg: >-
      DRBD is in use ({{ drbd_live.stdout_lines | join(', ') }}): take the resources down (drbdsetup down all) and
      stop what manages them first. Nothing was removed.
    quiet: true

# apt-get -s prints what a purge would take ("Purg <package> [...]"); the apt module reports no such list
- name: Simulate the purge  # noqa: command-instead-of-module
  ansible.builtin.command: apt-get -s purge {{ (drbd_packages + drbd_packages_extra) | map('quote') | join(' ') }}
  register: drbd_purge_sim
  changed_when: false
  check_mode: false
  # A package no source knows any more is not installed either
  failed_when: drbd_purge_sim.rc != 0 and 'Unable to locate package' not in drbd_purge_sim.stderr

- name: The purge removes the role's packages only
  ansible.builtin.assert:
    that:
      - drbd_purge_others | length == 0
    fail_msg: >-
      Purging {{ (drbd_packages + drbd_packages_extra) | join(' ') }} would also remove
      {{ drbd_purge_others | join(' ') }}, which depend on them: remove those first, or list them in
      drbd_packages_extra. Nothing was removed.
    quiet: true
  vars:
    drbd_purge_others: >-
      {{ drbd_purge_sim.stdout_lines | select('match', '^(Purg|Remv) ') | map('split', ' ') | map(attribute=1)
      | reject('in', drbd_packages + drbd_packages_extra) | list }}

# drbd-dkms's prerm removes the DKMS builds. A loaded module stays until reboot; the headers stay (shared).
- name: DRBD packages are purged
  ansible.builtin.apt:
    name: "{{ drbd_packages + drbd_packages_extra }}"
    state: absent
    purge: true

- name: Find the files the role writes with its marker
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ drbd_modprobe_file }}"
    - "{{ drbd_dkms_conf }}"
    - "{{ drbd_apt_pin_file }}"
  register: drbd_marked
  failed_when: false

- name: Files the role wrote are removed
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ drbd_marked.results | selectattr('content', 'defined') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: (item.content | b64decode).startswith(drbd_marker)

- name: Boot load file is removed
  ansible.builtin.file:
    path: "{{ drbd_modules_load_file }}"
    state: absent

# The source and keyring are the role's under method linbit only; method distribution never wrote them
- name: LINBIT source, keyring and key cache are removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ drbd_source_file }}"
    - "{{ drbd_apt_keyring }}"
    - "{{ drbd_cache_dir }}"
  notify: Refresh the package lists
  when: drbd_install_method == 'linbit'

- name: Find the graceful units' masks
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ item }}
  loop: "{{ drbd_graceful_units }}"
  register: drbd_graceful_masks

# The units went with drbd-utils: a mask left behind would only hide a later install's units
- name: Masks of the graceful units are removed
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ drbd_graceful_masks.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: drbd_absent_unmasked
  when: item.stat.islnk | default(false) and item.stat.lnk_target == '/dev/null'

- name: Wants links and ordering drop-ins of the graceful units are removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ drbd_graceful_units | map('regex_replace', '^', '/etc/systemd/system/' ~ drbd_graceful_shutdown_wanted_by ~ '.wants/')
    + drbd_graceful_units | map('regex_replace', '^(.*)$', '/etc/systemd/system/\1.d/' ~ drbd_graceful_dropin) }}
  register: drbd_absent_unlinked

# rmdir empties only: an admin's own drop-in keeps its directory
- name: Empty drop-in directories of the graceful units are removed
  ansible.builtin.command: rmdir --ignore-fail-on-non-empty /etc/systemd/system/{{ item }}.d
  loop: "{{ drbd_graceful_units }}"
  changed_when: false
  failed_when: false

- name: Reload systemd after the graceful units' links
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: drbd_absent_unmasked is changed or drbd_absent_unlinked is changed
