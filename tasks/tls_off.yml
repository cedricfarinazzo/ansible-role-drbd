---
# Only the files with the role's marker; ktls-utils stays (another kernel TLS user may need tlshd)
- name: Find the role's tlshd files
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ drbd_tls_config_file }}"
    - "{{ drbd_tls_dropin }}"
    - "{{ drbd_tls_modules_load_file }}"
  register: drbd_tls_marked
  failed_when: false

- name: The role's tlshd files are removed
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ drbd_tls_marked.results | selectattr('content', 'defined') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: (item.content | b64decode).startswith(drbd_marker)
  register: drbd_tls_removed

- name: Empty drop-in directory of tlshd is removed
  ansible.builtin.command: rmdir --ignore-fail-on-non-empty {{ drbd_tls_dropin | dirname }}
  changed_when: false
  failed_when: false

# Back on the package's own configuration, if it still runs (absent purged it: nothing to restart)
- name: Reload systemd and restart a running tlshd  # noqa: command-instead-of-module try-restart only if the unit exists
  ansible.builtin.shell: |
    systemctl daemon-reload
    if systemctl cat tlshd.service > /dev/null 2>&1; then systemctl try-restart tlshd.service; fi
  changed_when: true
  when: drbd_tls_removed.results | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0
